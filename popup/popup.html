<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fidelity Margin Calculator Auto</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="popup-title">Margin Calculator</h1>
      <span class="popup-version" id="version"></span>
    </header>
    <main>
    <section class="popup-section" aria-labelledby="status-heading">
      <h2 class="section-heading" id="status-heading">Status</h2>
      <div class="status-row">
        <span class="status-label" id="label-status">Status</span>
        <span class="status-dot inactive" id="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text" aria-live="polite" aria-atomic="true" aria-labelledby="label-status">Not connected</span>
      </div>
      <div class="status-row">
        <span class="status-label" id="label-account">Account</span>
        <span class="status-text" id="status-account" aria-live="polite" aria-atomic="true" aria-labelledby="label-account">--</span>
      </div>
      <div class="status-row">
        <span class="status-label" id="label-last-calc">Last Calc</span>
        <span class="status-text" id="status-last-calc" aria-live="polite" aria-atomic="true" aria-labelledby="label-last-calc">--</span>
      </div>
      <div class="status-row">
        <span class="status-label" id="label-api-calls">API Calls</span>
        <span class="status-text" id="status-api-calls" aria-live="polite" aria-atomic="true" aria-labelledby="label-api-calls">0</span>
      </div>
      <div class="status-row" id="status-error-row">
        <span class="status-label" id="label-error">Error</span>
        <span class="status-text status-error-text" id="status-error" aria-live="assertive" aria-atomic="true" aria-labelledby="label-error"></span>
      </div>
    </section>

    <!-- Settings Section -->
    <section class="popup-section" aria-labelledby="settings-heading">
      <h2 class="section-heading-wrap" id="settings-heading">
        <button class="section-header" id="settings-toggle" type="button"
                aria-expanded="true" aria-controls="settings-body">
          Settings
          <span class="toggle-arrow" id="settings-arrow" aria-hidden="true">&#9662;</span>
        </button>
      </h2>
      <div class="settings-body" id="settings-body">
        <div class="setting-row">
          <label class="setting-label" for="setting-enabled">Enabled</label>
          <label class="switch">
            <input type="checkbox" id="setting-enabled" checked>
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
        <div class="setting-row">
          <label class="setting-label" for="setting-threshold">Warning threshold ($)</label>
          <input type="number" id="setting-threshold" class="setting-input" value="500" min="0" max="100000" step="50">
        </div>
        <div class="setting-row">
          <label class="setting-label" for="setting-debounce">Debounce</label>
          <select id="setting-debounce" class="setting-select">
            <option value="200">Fast (200ms)</option>
            <option value="500" selected>Normal (500ms)</option>
            <option value="1000">Conservative (1s)</option>
          </select>
        </div>
      </div>
    </section>
    </main>

    <footer class="popup-footer">
      <button type="button" class="btn-refresh" id="btn-refresh" aria-describedby="btn-refresh-status">Force Recalculate</button>
      <span id="btn-refresh-status" aria-live="polite" aria-atomic="true" class="refresh-status"></span>
    </footer>
  </div>
  <script src="../lib/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
